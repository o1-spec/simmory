<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="simmory-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334F4A"/>
      <stop offset="100%" stop-color="#243935"/>
    </linearGradient>
    <filter id="simmory-glow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Forest Green Squircle Canvas -->
  <rect width="512" height="512" rx="116" fill="url(#simmory-bg)"/>
  
  <!-- Subtle Internal Archival Border -->
  <rect x="14" y="14" width="484" height="484" rx="104" fill="none" stroke="#F2F2EB" stroke-width="3" stroke-opacity="0.12"/>

  <!-- Ochre Steam Accents Floating Above Center Peak -->
  <path d="M 252 88 C 255 70, 266 60, 274 48" fill="none" stroke="#F5B726" stroke-width="18" stroke-linecap="round"/>
  <circle cx="282" cy="40" r="9" fill="#F5B726"/>
  <circle cx="236" cy="68" r="6" fill="#F5B726" opacity="0.85"/>

  <!-- Chef's Hat Silhouette Group with Soft Archival Shadow -->
  <g filter="url(#simmory-glow)">
    <!-- 3-Lobed Billowing Crown -->
    <path
      d="M 166 295
         C 120 280, 108 215, 148 175
         C 162 160, 185 156, 206 164
         C 220 120, 292 120, 306 164
         C 327 156, 350 160, 364 175
         C 404 215, 392 280, 346 295
         Z"
      fill="#F2F2EB"
    />

    <!-- Headband Base -->
    <rect x="160" y="306" width="192" height="88" rx="18" fill="#F2F2EB"/>

    <!-- Headband Pleats / Vent Accents in Forest Green -->
    <line x1="216" y1="324" x2="216" y2="372" stroke="#2E4742" stroke-width="9" stroke-linecap="round"/>
    <line x1="256" y1="322" x2="256" y2="374" stroke="#2E4742" stroke-width="9" stroke-linecap="round"/>
    <line x1="296" y1="324" x2="296" y2="372" stroke="#2E4742" stroke-width="9" stroke-linecap="round"/>

    <!-- Ochre Golden Accent Stitch along Headband Bottom -->
    <line x1="192" y1="392" x2="320" y2="392" stroke="#F5B726" stroke-width="7" stroke-linecap="round"/>
  </g>
</svg>
