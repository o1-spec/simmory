version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: simmory-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: simmory
      POSTGRES_PASSWORD: simmory_dev_secret
      POSTGRES_DB: simmory_dev
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U simmory -d simmory_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: simmory-redis
    restart: unless-stopped
    command: >
      redis-server
      --maxmemory 256mb
      --maxmemory-policy noeviction
      --save 60 1
      --loglevel notice
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  postgres_data:
  redis_data:
